
services:
  - type: web
    name: ai-resume-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn resumeskill.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

